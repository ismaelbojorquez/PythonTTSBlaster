# Plantilla de servidor. El instalador guarda la configuración privada en /etc/pythonblastertts/config.toml.
mode = "sip"
web_port = 8765 # puerto del panel en http://127.0.0.1:8765
web_public_url = "https://app.example.com" # REEMPLAZA por tu dominio; el proceso sigue sirviendo HTTP
data_dir = "/var/lib/pythonblastertts"
reporting_timezone = "America/Mexico_City"
report_max_rows = 20000
concurrency = 20
trunk_channels = 40 # 20 sesiones; cada una reserva 2 canales para poder transferir
calls_per_second = 1.0
ring_timeout = 40.0
agent_timeout = 30.0
choice_timeout = 12.0
max_call_seconds = 1800.0
max_repeats = 2
tts_workers = 2
tts_timeout = 90.0
tts_engine = "piper" # cambia a "kokoro" después de medirlo en este servidor
voice_model = "/var/lib/pythonblastertts/voices/es_MX-claude-high.onnx" # voz activa; compárala en Operación → Voces
routing = "priority"

[kokoro]
enabled = false
python = "/opt/pythonblastertts/.venv-kokoro/bin/python"
model = "/opt/pythonblastertts/.cache/kokoro/models/kokoro-v1.0.onnx"
voices = "/opt/pythonblastertts/.cache/kokoro/models/voices-v1.0.bin"
voice = "ef_dora"
language = "es"
speed = 1.0
startup_timeout = 90.0

[amd]
enabled = true # análisis local por señales, sin IA; sólo en la llamada al contacto
unknown_action = "hangup" # los resultados inciertos se cuelgan antes del TTS
total_analysis_ms = 6500 # máximo estricto; termina antes cuando hay evidencia suficiente
initial_silence_ms = 5000 # permite un saludo tardío; silencio sigue siendo INCIERTO
after_greeting_silence_ms = 1400 # no confundir tan pronto una pausa del buzón con humano
greeting_speech_ms = 3200 # permite saludos humanos más largos
minimum_word_ms = 140 # descarta ráfagas/clics más cortos
minimum_human_speech_ms = 200 # voz acumulada mínima para aceptar humano
between_words_silence_ms = 200
maximum_words = 6 # segmentos acústicos, no palabras reconocidas
silence_threshold = 256 # RMS del PCM de 16 bits; aumentar si hay mucho ruido
beep_enabled = true
beep_min_ms = 360 # reduce falsos buzones por tonos breves
beep_min_hz = 600
beep_max_hz = 2000
beep_purity = 0.92
beep_frequency_tolerance_hz = 35
calibration_capture_enabled = false # actívalo temporalmente para etiquetar saludos
calibration_retention_days = 14
calibration_max_samples = 500

[sip]
domain = "sip.proveedor.example"
username = "usuario"
password = '' # contraseña de la troncal, escrita directamente aquí
auth_username = "" # vacío usa username
caller_id = "" # vacío usa username; el proveedor debe autorizar este número
registrar = "sip:sip.proveedor.example"
proxy = "" # ej. "sip:sbc.proveedor.example;lr"
registration_enabled = true # false para troncal autenticada por IP
dial_format = "as_entered" # "mexico_52": 52 + 10 dígitos, sin +, para contacto y agente
transport = "udp" # "udp" o "tcp"; TLS/SRTP fuera del alcance inicial
bind_address = "0.0.0.0"
local_port = 5060
public_address = "" # IP pública anunciada en SIP y SDP, si hay NAT estático
rtp_port = 10000
rtp_port_range = 200 # abrir UDP 10000–10200, incluidos RTP y RTCP

[auth]
enabled = true
session_hours = 8
# Sólo crea el primer administrador si la base todavía no tiene usuarios.
bootstrap_username = ""
bootstrap_password = '' # mínimo 12 caracteres; no cambia usuarios existentes
bootstrap_display_name = "Administrador"

[recordings]
enabled = true
retention_days = 30
max_storage_mb = 10240
min_free_mb = 256

[automation]
enabled = true
poll_seconds = 5
late_schedule_minutes = 60
trunk_alert_seconds = 60
failure_alert_percent = 50
failure_alert_min_calls = 10
report_retention_days = 90
