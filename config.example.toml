# Copia a config.toml. Abre el panel en http://localhost:8765.
mode = "simulation" # "sip" para la troncal real
web_port = 8765 # puerto del panel en http://127.0.0.1:8765
web_public_url = "" # acceso local por HTTP, sin dominio
data_dir = "data"
reporting_timezone = "America/Mexico_City"
report_max_rows = 20000
concurrency = 3
trunk_channels = 10 # cada sesión reserva 2 para poder llamar al agente
calls_per_second = 1.0
ring_timeout = 40.0
agent_timeout = 30.0
choice_timeout = 12.0
max_call_seconds = 1800.0
max_repeats = 2
tts_workers = 2
tts_timeout = 90.0
voice_model = "voices/es_MX-claude-high.onnx" # Piper mexicano: mejor latencia medida
routing = "priority"

[amd]
enabled = true # análisis local por señales, sin IA; sólo en la llamada al contacto
unknown_action = "continue" # sólo se cuelga con evidencia de buzón; los inciertos continúan
total_analysis_ms = 5000 # máximo estricto; termina antes cuando hay evidencia suficiente
initial_silence_ms = 3500 # margen para quien tarda en saludar; silencio sigue siendo INCIERTO
after_greeting_silence_ms = 1400 # no confundir tan pronto una pausa del buzón con humano
greeting_speech_ms = 3200 # permite saludos humanos más largos
minimum_word_ms = 140 # descarta ráfagas/clics más cortos
minimum_human_speech_ms = 200 # voz válida acumulada mínima antes de aceptar humano
between_words_silence_ms = 200 # evita contar pausas muy cortas como segmentos distintos
maximum_words = 6 # segmentos acústicos, no palabras reconocidas
silence_threshold = 256 # RMS del PCM de 16 bits; aumentar si hay mucho ruido
beep_enabled = true
beep_min_ms = 360 # exige un tono sostenido; un tono corto no cuenta como saludo humano
beep_min_hz = 600
beep_max_hz = 2000
beep_purity = 0.92
beep_frequency_tolerance_hz = 35

[sip]
domain = "sip.proveedor.example"
username = "usuario"
password = '' # contraseña de la troncal, escrita directamente aquí
auth_username = "" # vacío usa username
caller_id = "" # vacío usa username; el proveedor debe autorizar este número
registrar = "sip:sip.proveedor.example"
proxy = "" # ej. "sip:sbc.proveedor.example;lr"
registration_enabled = true # false para troncal autenticada por IP
dial_format = "as_entered" # la campaña agrega el prefijo del país; "mexico_52" limita a México
transport = "udp" # "udp" o "tcp"; TLS/SRTP fuera del alcance inicial
bind_address = "0.0.0.0"
local_port = 5060
public_address = "" # IP pública anunciada en SIP y SDP, si hay NAT estático
rtp_port = 10000
rtp_port_range = 200 # abrir UDP 10000–10200, incluidos RTP y RTCP

[auth]
enabled = true
session_hours = 8
# Sólo crea el primer administrador si la base todavía no tiene usuarios.
bootstrap_username = ""
bootstrap_password = '' # mínimo 12 caracteres; no cambia usuarios existentes
bootstrap_display_name = "Administrador"

[recordings]
enabled = true
retention_days = 30
max_storage_mb = 10240
min_free_mb = 256

[automation]
enabled = true
poll_seconds = 5
late_schedule_minutes = 60
trunk_alert_seconds = 60
failure_alert_percent = 50
failure_alert_min_calls = 10
report_retention_days = 90
