[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "python-blaster-tts"
version = "0.1.0"
description = "Campañas SIP y TTS local, con puente de audio al agente"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY.md", "src/blaster/static/chart-LICENSE.txt"]
requires-python = ">=3.11,<3.14"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1", "pydantic>=2.10,<3", "numpy>=1.26,<3", "openpyxl>=3.1.5,<4", "soundfile>=0.13.1,<0.14", "tomlkit>=0.13,<1", "phonenumbers>=9,<10"]

[project.optional-dependencies]
voice = ["piper-tts>=1.3,<2"]
dev = ["pytest>=8,<10", "pytest-asyncio>=1,<2", "httpx>=0.28,<1", "ruff>=0.11,<1"]

[project.scripts]
blaster = "blaster.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
blaster = ["static/*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
